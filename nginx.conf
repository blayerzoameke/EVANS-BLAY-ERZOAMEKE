server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip compression — faster load times ──────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript
               application/x-javascript application/xml application/json
               application/manifest+json image/svg+xml;

    # ── React SPA routing ─────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Manifest — correct content-type for PWA installability ───────────
    location = /manifest.webmanifest {
        add_header Content-Type "application/manifest+json";
        add_header Cache-Control "no-cache";
    }

    # ── Service Worker — never cache ──────────────────────────────────────
    location = /sw.js {
        add_header Content-Type "application/javascript";
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Icons and images — cache 30 days ─────────────────────────────────
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── JS and CSS — cache 7 days ─────────────────────────────────────────
    location ~* \.(js|css)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── Security + iframe headers ──────────────────────────────────────────
    # CRITICAL: frame-ancestors must allow YouTube for break view embeds.
    # X-Frame-Options is replaced by CSP frame-ancestors below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Content Security Policy ────────────────────────────────────────────
    # Allows:
    # - Google APIs (Firebase, Gemini)
    # - YouTube embeds (break view)
    # - Paystack payments
    # - CDN resources (KaTeX, Chart.js, PDF.js, Tailwind)
    # - Firebase auth (popup flow)
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval'
            https://cdn.tailwindcss.com
            https://cdn.jsdelivr.net
            https://unpkg.com
            https://cdnjs.cloudflare.com
            https://www.youtube.com
            https://s.ytimg.com
            https://js.paystack.co
            https://apis.google.com
            https://*.googleapis.com
            https://*.firebaseapp.com
            https://*.firebaseio.com;
        style-src 'self' 'unsafe-inline'
            https://cdn.tailwindcss.com
            https://cdn.jsdelivr.net
            https://unpkg.com
            https://fonts.googleapis.com;
        font-src 'self'
            https://fonts.gstatic.com
            https://cdn.jsdelivr.net
            data:;
        img-src 'self' data: blob:
            https://*.googleapis.com
            https://*.gstatic.com
            https://img.youtube.com
            https://i.ytimg.com
            https://lh3.googleusercontent.com
            https://*.google.com;
        frame-src 'self'
            https://www.youtube.com
            https://www.youtube-nocookie.com
            https://*.firebaseapp.com
            https://accounts.google.com;
        connect-src 'self'
            https://*.googleapis.com
            https://*.firebaseio.com
            https://*.cloudfunctions.net
            https://firestore.googleapis.com
            https://identitytoolkit.googleapis.com
            https://securetoken.googleapis.com
            https://generativelanguage.googleapis.com
            https://api.paystack.co
            wss://*.firebaseio.com;
        media-src 'self' blob:
            https://www.youtube.com;
        worker-src 'self' blob:;
        manifest-src 'self';
    " always;
}