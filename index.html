<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='128' fill='%230284c7'/%3E%3Cg font-family='Arial, sans-serif' font-weight='bold' text-anchor='middle' fill='white'%3E%3Ctext x='256' y='280' font-size='220'%3EEB%3C/text%3E%3Ctext x='256' y='400' font-size='60'%3EEduBlay%3C/text%3E%3C/g%3E%3C/svg%3E">

    <title>EduBlay - Your Learning Companion</title>

    <!-- THEME FLASH PREVENTION — runs synchronously before React mounts. -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var dark = saved === 'dark' ||
            ((!saved || saved === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.background = '#111827';
            document.body && (document.body.style.background = '#111827');
          }
        } catch(e) {}
      })();
    </script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://unpkg.com/react-image-crop@11.0.5/dist/ReactCrop.css" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" crossorigin="anonymous"></script>
    <script>
      if (typeof pdfjsLib !== 'undefined') {
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes fade-in-down {
        from { opacity: 0; transform: translateY(-1rem); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in-down { animation: fade-in-down 0.5s ease-out forwards; }

      html {
        height: 100%;
        height: -webkit-fill-available;
      }
      body {
        min-height: 100%;
        min-height: -webkit-fill-available;
        overscroll-behavior-y: none;
      }
      #root {
        height: 100%;
        min-height: 100dvh;
      }

      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
      }

      :root, html[data-theme="blue"] { --primary-hue: 207; --secondary-hue: 260; --tertiary-hue: 45; --success-hue: 145; --neutral-hue: 215; }
      html[data-theme="purple"] { --primary-hue: 260; --secondary-hue: 320; --tertiary-hue: 50; }
      html[data-theme="green"]  { --primary-hue: 145; --secondary-hue: 190; --tertiary-hue: 95; }
      html[data-theme="orange"] { --primary-hue: 25;  --secondary-hue: 5;   --tertiary-hue: 40; }
      html[data-theme="pink"]   { --primary-hue: 330; --secondary-hue: 280; --tertiary-hue: 350; }
      html[data-theme="emerald"]{ --primary-hue: 160; --secondary-hue: 180; --tertiary-hue: 140; }

      /* ── iOS install screen (static, paints before any app JS) ── */
      #eb-ios-install {
        position: fixed; inset: 0; z-index: 2147483647;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center;
        padding: calc(28px + var(--sat)) 22px calc(28px + var(--sab));
        background: linear-gradient(160deg,#0b1220 0%,#0f172a 48%,#111827 100%);
        color: #fff; font-family: system-ui, -apple-system, sans-serif;
        animation: ebfade .35s ease-out both; overflow-y: auto;
      }
      @keyframes ebfade { from{opacity:0} to{opacity:1} }
      @keyframes ebpulse { 0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.5)} 70%{box-shadow:0 0 0 22px rgba(37,99,235,0)} }
      #eb-ios-install .eb-logo {
        width: 84px; height: 84px; border-radius: 24px;
        background: linear-gradient(145deg,#3b82f6,#2563eb 60%,#1d4ed8);
        display: flex; align-items: center; justify-content: center;
        font-weight: 900; font-size: 30px; letter-spacing: -2px; color: #fff;
        margin-bottom: 22px; animation: ebpulse 2.4s ease-in-out infinite;
      }
      #eb-ios-install h1 { font-size: 26px; font-weight: 900; line-height: 1.15; margin: 0 0 10px; max-width: 440px; }
      #eb-ios-install h1 span { background: linear-gradient(90deg,#60a5fa,#818cf8); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
      #eb-ios-install p.sub { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,.66); max-width: 380px; margin: 0 0 22px; }
      #eb-ios-install .eb-card {
        background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12);
        border-radius: 18px; padding: 20px; max-width: 400px; width: 100%;
        text-align: left; backdrop-filter: blur(10px); margin-bottom: 18px;
      }
      #eb-ios-install .eb-step { display: flex; align-items: center; gap: 14px; padding: 10px 0; }
      #eb-ios-install .eb-num {
        flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
        background: linear-gradient(135deg,#2563eb,#1d4ed8); color: #fff;
        font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center;
      }
      #eb-ios-install .eb-step b { color: #fff; font-weight: 700; }
      #eb-ios-install .eb-step span { font-size: 14.5px; color: rgba(255,255,255,.82); line-height: 1.45; }
      #eb-ios-install .eb-share { display: inline-flex; vertical-align: middle; width: 22px; height: 22px; margin: 0 2px; }
      #eb-ios-install .eb-continue {
        margin-top: 10px; background: none; border: none; color: rgba(255,255,255,.5);
        font-size: 13px; font-weight: 600; text-decoration: underline; cursor: pointer; padding: 8px;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: {
                light: 'hsl(var(--primary-hue) 90% 60%)',
                DEFAULT: 'hsl(var(--primary-hue) 85% 55%)',
                dark: 'hsl(var(--primary-hue) 85% 48%)',
                text: 'hsl(var(--primary-hue) 100% 98%)'
              },
              study: '#2563eb',
              lecture: '#7c3aed',
              agenda: '#ea580c',
              break: '#16a34a',
              free: '#4b5563',
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body class="bg-gray-100 dark:bg-gray-900">
    <div id="root"></div>

    <!--
      iOS INSTALL SCREEN — plain inline script that runs BEFORE the app bundle, so
      iPhone/iPad users always see "Add to Home Screen" guidance instantly, even if
      the heavy app never finishes rendering. Works for Safari, Chrome and Firefox
      on iOS — all of them can add the app to the Home Screen. Never shows once
      installed (standalone) or on Android/desktop.
    -->
    <script>
      (function () {
        try {
          var ua = navigator.userAgent || '';
          var isIOS = /iphone|ipad|ipod/i.test(ua) ||
            (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); // iPadOS
          var isStandalone = window.navigator.standalone === true ||
            (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);

          if (!isIOS || isStandalone) return;
          try { if (sessionStorage.getItem('eb_ios_install_dismissed') === '1') return; } catch (e) {}

          var shareSvg =
            '<svg class="eb-share" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
            '<path d="M12 16V4"/><path d="M8 8l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>';

          var html =
            '<div class="eb-logo">EB</div>' +
            '<h1>Add <span>EduBlay</span> to your Home Screen</h1>' +
            '<p class="sub">For the best experience on iPhone, install EduBlay. It opens full-screen and runs smoothly — no loading problems.</p>' +
            '<div class="eb-card">' +
              '<div class="eb-step"><div class="eb-num">1</div><span>Tap the <b>Share</b> ' + shareSvg + ' or <b>menu</b> button in your browser\'s toolbar.</span></div>' +
              '<div class="eb-step"><div class="eb-num">2</div><span>Scroll and tap <b>"Add to Home Screen"</b>.</span></div>' +
              '<div class="eb-step"><div class="eb-num">3</div><span>Tap <b>"Add"</b>, then open <b>EduBlay</b> from your Home Screen.</span></div>' +
            '</div>' +
            '<button class="eb-continue" id="eb-continue-btn">Continue in browser anyway</button>';

          var overlay = document.createElement('div');
          overlay.id = 'eb-ios-install';
          overlay.innerHTML = html;

          function mount() {
            if (!document.body) { setTimeout(mount, 10); return; }
            document.body.appendChild(overlay);
            var btn = document.getElementById('eb-continue-btn');
            if (btn) btn.addEventListener('click', function () {
              try { sessionStorage.setItem('eb_ios_install_dismissed', '1'); } catch (e) {}
              overlay.parentNode && overlay.parentNode.removeChild(overlay);
            });
          }
          mount();
        } catch (e) { /* never block the page */ }
      })();
    </script>

    <script type="module" src="/index.tsx"></script>
  </body>
</html>
