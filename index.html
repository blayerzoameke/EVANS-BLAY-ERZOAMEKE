<style>
  @media print {
    body {
      background-color: white !important;
      /* Ensures background colors and images are printed */
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    
    /* Hide elements that should not be printed using a class */
    .no-print {
      display: none !important;
    }

    /* A more robust method to isolate only the printable area */
    body * {
        visibility: hidden;
    }
    #printable-area, #printable-area * {
        visibility: visible;
    }
    #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 1rem;
        margin: 0;
    }
  }
</style>
